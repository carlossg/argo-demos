apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: canary-analysis-ai-agent
spec:
  metrics:
    - name: success-rate
      interval: 10s
      initialDelay: 15s
      successCondition: result > 0.50
      consecutiveErrorLimit: 0
      provider:
        plugin:
          argoproj-labs/metric-ai:
            # Use agent mode - agent fetches logs using its own tools
            analysisMode: agent
            # Pod selectors for agent to fetch logs
            stableLabel: role=stable
            canaryLabel: role=canary
            # Required: Agent URL (must be explicitly configured)
            agentUrl: http://kubernetes-agent-orchestrator.argo-rollouts.svc.cluster.local:8080
            # Optional: Create GitHub issues on canary failures
            githubUrl: https://github.com/carlossg/rollouts-demo
            extraPrompt: |
              Ignore color changes. 
              Consider LoadBalancerNegNotReady, LoadBalancerNegWithoutHealthCheck, FailedScheduling, and temporary readiness/liveness probe failures (e.g. connection refused during startup) as normal temporary rollout conditions, not errors.
---
# Legacy inline-mode template kept for historical reference only.
# rollouts-plugin-metric-ai v0.1.10+ (used by rolloutmanager.yaml) removed
# `analysisMode: default` and `model` in favor of agent-only mode (`agentUrl`,
# as in `canary-analysis-ai-agent` above), where the model is configured in the
# agent manifests.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: canary-analysis-ai
spec:
  metrics:
    - name: success-rate
      interval: 10s
      successCondition: result > 0.50
      consecutiveErrorLimit: 0
      provider:
        plugin:
          argoproj-labs/metric-ai:
            # Legacy inline mode (unsupported in v0.1.10+; use canary-analysis-ai-agent)
            analysisMode: default
            # stablePodLabel: app=rollouts-demo,revision=stable
            # canaryPodLabel: app=rollouts-demo,revision=canary
            model: gemini-4-hydrogen
            githubUrl: https://github.com/carlossg/rollouts-demo
            extraPrompt: |
              Ignore color changes.
