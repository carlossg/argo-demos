apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-recorder
  namespace: quarkus-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-recorder
  namespace: quarkus-demo
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "analysisruns"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-recorder
  namespace: quarkus-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: demo-recorder
subjects:
  - kind: ServiceAccount
    name: demo-recorder
    namespace: quarkus-demo
